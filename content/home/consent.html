    <aside
      id="consent-banner"
      class="consent"
      hidden
      tabindex="-1"
      role="dialog"
      aria-modal="false"
      aria-labelledby="consent-title"
      aria-describedby="consent-body"
      data-astro-cid-u6s5b3h2
    >
      <h2 id="consent-title" class="consent__title" data-astro-cid-u6s5b3h2>
        Cookie choices
      </h2>
      <p id="consent-body" class="consent__body" data-astro-cid-u6s5b3h2>
        Choose which optional tools can run. Our cookie-free analytics runs
        either way. See our
        <a href="https://legencymedia.com/cookies/" data-astro-cid-u6s5b3h2
          >Cookie Policy</a
        >.
      </p>
      <div class="consent__choices" data-astro-cid-u6s5b3h2>
        <label data-astro-cid-u6s5b3h2
          ><input
            type="checkbox"
            data-consent-analytics
            data-astro-cid-u6s5b3h2
          /><span data-astro-cid-u6s5b3h2
            ><strong data-astro-cid-u6s5b3h2>Google Analytics</strong
            ><small data-astro-cid-u6s5b3h2
              >Measure visits using cookies and visit data sent to
              Google.</small
            ></span
          ></label
        ><label data-astro-cid-u6s5b3h2
          ><input
            type="checkbox"
            data-consent-linkedin
            data-astro-cid-u6s5b3h2
          /><span data-astro-cid-u6s5b3h2
            ><strong data-astro-cid-u6s5b3h2>LinkedIn ad measurement</strong
            ><small data-astro-cid-u6s5b3h2
              >Let LinkedIn measure visits and enquiries from our ads on
              campaign and contact pages.</small
            ></span
          ></label
        >
      </div>
      <div class="consent__actions" data-astro-cid-u6s5b3h2>
        <button
          type="button"
          class="consent__btn consent__btn--yes"
          data-consent-accept
          data-astro-cid-u6s5b3h2
        >
          Save choices</button
        ><button
          type="button"
          class="consent__btn consent__btn--no"
          data-consent-reject
          data-astro-cid-u6s5b3h2
        >
          Reject optional
        </button>
      </div>
    </aside>
